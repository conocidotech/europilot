name: NDW schema canary

# The unit tests run against a checked-in snapshot, so they stay green even if
# NDW changes the feed. Then the parser returns nothing and the car silently
# loses its dynamic speed limit. This hits the live feed daily and fails loudly.
# Deliberately not on pull_request: a flaky third-party feed must never block a PR.

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        # schema_check is stdlib-only, but importing europilot/ pulls in flags.py.
        run: pip install pynacl

      - name: Check the live NDW feed against the parser
        id: check
        run: python -m europilot.ndw.schema_check

      - name: Open an issue on drift
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'NDW feed schema drift detected';
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'ndw-canary',
            });
            if (open.length) {
              core.info(`Issue #${open[0].number} is already open, not filing another.`);
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title,
              labels: ['ndw-canary'],
              body: [
                'The daily canary found that the live NDW feed no longer matches what',
                '`europilot/ndw` expects. The parser may be silently returning nothing,',
                'which means no dynamic speed limit on the road.',
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ].join('\n'),
            });
